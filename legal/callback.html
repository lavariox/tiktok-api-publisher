<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conecta AI Publisher — Autorización TikTok</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #faf7f2; color: #333; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; }
  main { background: #fff; border: 1px solid #e8e0d5; border-radius: 16px; max-width: 560px; width: 100%; padding: 32px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,.06); }
  h1 { font-size: 22px; margin-bottom: 12px; color: #222; }
  p { font-size: 15px; line-height: 1.6; color: #555; margin-bottom: 12px; }
  code { display: block; background: #faf7f2; border: 1px solid #e8e0d5; border-radius: 8px; padding: 14px; font-size: 13px; word-break: break-all; margin: 12px 0; color: #222; }
  button { background: #c2410c; color: #fff; border: 0; border-radius: 999px; padding: 12px 28px; font-size: 15px; cursor: pointer; }
  button:hover { background: #9a3412; }
  .ok { color: #15803d; font-weight: 600; }
  .err { color: #b91c1c; font-weight: 600; }
  small { color: #888; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Conecta AI Publisher</h1>
  <p id="status">Procesando la autorización…</p>
  <div id="code-box" style="display:none">
    <p>Tu código de autorización es:</p>
    <code id="code"></code>
    <button id="copy" type="button">Copiar código</button>
    <p style="margin-top:16px">Pasale este código a Zbot para completar la conexión con TikTok. <small>El código es de un solo uso y vence en unos minutos.</small></p>
  </div>
  <p id="hint" style="display:none"><small>Si ves esta página sin código, la autorización no se completó. Volvé a intentar desde la app.</small></p>
<script>
  var q = new URLSearchParams(location.search);
  var code = q.get('code'), err = q.get('error');
  var status = document.getElementById('status');
  if (code) {
    status.innerHTML = '<span class="ok">Autorización completada.</span>';
    document.getElementById('code').textContent = code;
    document.getElementById('code-box').style.display = 'block';
    document.getElementById('copy').onclick = function () {
      var t = document.getElementById('code').textContent;
      if (navigator.clipboard) { navigator.clipboard.writeText(t); this.textContent = 'Copiado'; }
    };
  } else if (err) {
    status.innerHTML = '<span class="err">La autorización no se completó: ' + err + '.</span>';
    document.getElementById('hint').style.display = 'block';
  } else {
    status.textContent = 'No llegó ningún código de autorización.';
    document.getElementById('hint').style.display = 'block';
  }
</script>
</main>
</body>
</html>
